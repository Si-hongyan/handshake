# 固定二维握手区域 ROI（阶段一：不计算三维坐标）
#
# 坐标以“归一化比例”存储（0.0~1.0），与摄像头分辨率无关，
# 这样换分辨率/换摄像头也不用改数值。
# 运行时 Windows 侧可用鼠标拖拽调整，按 's' 保存回本文件。
#
# 判定规则：手腕中心点(landmark 0)落入该矩形，才算 inside_handshake_zone。

roi:
  # 归一化矩形：左上角 (x, y) 与 宽高 (w, h)，均为画面比例。
  # 默认放在画面中央偏右的一块区域。
  x: 0.55
  y: 0.30
  w: 0.35
  h: 0.40

  # 可视化颜色 (B, G, R) 与线宽（像素）。
  color_bgr: [0, 200, 255]
  thickness: 2
  label: "HANDSHAKE ZONE"
